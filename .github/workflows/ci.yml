name: ci

on:
  push:
  pull_request:

jobs:
  # The compiler, lawc, the benchmarks' executables and the gates, without the sandbox (no vcpkg needed). No GPU on the
  # runner: the CUDA gates say so and check the CPU path. The gates labelled `slow` (minutes each on 4 cores without
  # a card) run in slow-gates.yml.
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libomp-dev
      - name: Configure
        run: cmake --preset linux-core
      - name: Build
        run: cmake --build --preset linux-core
      - name: Gates
        run: ctest --preset linux-core -LE slow --timeout 900

  # The JAX twin against the C++ reference (the whole shipped law, a few steps, field by field), and the numerical
  # checks that need no card: convergence orders (verify.py) and the finance PDEs (finance.py --cpu) on the CPU
  # reference, each asserting its orders. Their tables are uploaded.
  lawjax-parity:
    runs-on: ubuntu-24.04
    needs: linux-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libomp-dev
      - name: Build lawc
        run: cmake --preset linux-core && cmake --build --preset linux-core --target lawc
      - name: Python
        run: pip install -r requirements.txt
      - name: Parity
        working-directory: build
        run: python ../tools/lawjax/parity.py --scene assets/scenes/fire_test.scene --steps 3 --dt 0.25 --lawc ./lawc
      - name: Orders of convergence
        run: python bench/verify.py
      - name: Finance on the CPU
        run: python bench/finance.py --cpu
      - uses: actions/upload-artifact@v4
        with:
          name: numerics-cpu
          path: |
            bench/results/verify_cpu.*
            bench/results/finance_cpu.*
